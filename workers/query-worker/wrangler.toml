name = "query-worker"
main = "src/index.ts"
compatibility_date = "2026-02-16"

[env.production]
name = "query-worker-prod"

[[env.production.d1_databases]]
binding = "DB"
database_id = "61273132-a0db-4835-a80d-524e77d9d8b4"
database_name = "edgedata-db"

[[env.production.r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "edgedata-raw"

[[env.production.analytics_engine_datasets]]
binding = "WAE"
dataset = "log_metrics"

[[env.production.services]]
binding = "SYNTHETIC_SERVICE"
service = "synthetic-worker-prod"

[[env.production.services]]
binding = "ALERT_SERVICE"
service = "alert-worker-prod"

[env.production.vars]
CF_ACCOUNT_ID = ""
REQUIRE_ACCESS_JWT = "true"
# Replace with your Cloudflare Access application AUD for this environment.
ACCESS_AUD = "6d60cfebfc4c552e255d9324f1ea50f98b3506b8676231857fd8e1f9c4453a85"
ACCESS_ISSUER = "https://edgedata.cloudflareaccess.com"
ACCESS_JWKS_URL = ""
# Replace with your real Access/IdP group names for role mapping.
ACCESS_SUPERADMIN_GROUPS = "edgedata-superadmins"
ACCESS_VIEWER_GROUPS = "edgedata-viewers"
ACCESS_ANALYST_GROUPS = "edgedata-analysts"
ACCESS_ADMIN_GROUPS = "edgedata-admins"
ACCESS_ADMIN_EMAILS = ""
AUTH_ENABLE_LOCAL_LOGIN = "true"
AUTH_BOOTSTRAP_SUPERADMIN_EMAIL = ""
AUTH_BOOTSTRAP_EMAIL = ""
AUTH_INVITE_TTL_HOURS = "48"
SESSION_TTL_SECONDS = "43200"
QUERY_RATE_LIMIT_PER_MIN = "600"
AUTH_LOGIN_RATE_LIMIT_PER_MIN = "60"
DASHBOARD_CACHE_SHARDS = "16"
CORS_ORIGINS = "https://edgedata-1fo.pages.dev,https://*.edgedata-1fo.pages.dev"
# Set to "true" for demo deployments to enable scenario picker in Incident Workspace.
DEMO_SCENARIOS_ENABLED = "false"

[env.production.durable_objects]
bindings = [
  { name = "TAIL_HUB", class_name = "TailHub" },
  { name = "DASHBOARD_CACHE", class_name = "DashboardCache" }
]

[[d1_databases]]
binding = "DB"
database_id = "61273132-a0db-4835-a80d-524e77d9d8b4"
database_name = "edgedata-db"

[[r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "edgedata-raw"

[[analytics_engine_datasets]]
binding = "WAE"
dataset = "log_metrics"

[[services]]
binding = "SYNTHETIC_SERVICE"
service = "synthetic-worker"

[[services]]
binding = "ALERT_SERVICE"
service = "alert-worker"

[vars]
CF_ACCOUNT_ID = ""
REQUIRE_ACCESS_JWT = "true"
# Replace with your Cloudflare Access application AUD for this environment.
ACCESS_AUD = "edgedata-query-aud"
ACCESS_ISSUER = "https://edgedata.cloudflareaccess.com"
ACCESS_JWKS_URL = ""
# Replace with your real Access/IdP group names for role mapping.
ACCESS_SUPERADMIN_GROUPS = "edgedata-superadmins"
ACCESS_VIEWER_GROUPS = "edgedata-viewers"
ACCESS_ANALYST_GROUPS = "edgedata-analysts"
ACCESS_ADMIN_GROUPS = "edgedata-admins"
ACCESS_ADMIN_EMAILS = ""
AUTH_ENABLE_LOCAL_LOGIN = "true"
AUTH_BOOTSTRAP_SUPERADMIN_EMAIL = ""
AUTH_BOOTSTRAP_EMAIL = ""
AUTH_INVITE_TTL_HOURS = "48"
SESSION_TTL_SECONDS = "43200"
QUERY_RATE_LIMIT_PER_MIN = "600"
AUTH_LOGIN_RATE_LIMIT_PER_MIN = "60"
DASHBOARD_CACHE_SHARDS = "16"
CORS_ORIGINS = "https://edgedata-1fo.pages.dev,https://*.edgedata-1fo.pages.dev"
# Set to "true" for demo deployments to enable scenario picker in Incident Workspace.
DEMO_SCENARIOS_ENABLED = "false"

[durable_objects]
bindings = [
  { name = "TAIL_HUB", class_name = "TailHub" },
  { name = "DASHBOARD_CACHE", class_name = "DashboardCache" }
]

[[migrations]]
tag = "v1"
new_classes = ["TailHub"]

[[migrations]]
tag = "v2"
new_classes = ["DashboardCache"]
