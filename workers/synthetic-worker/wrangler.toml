name = "synthetic-worker"
main = "src/index.ts"
compatibility_date = "2026-02-16"

triggers = { crons = ["*/30 * * * *"] }

[env.production]
name = "synthetic-worker-prod"

[[d1_databases]]
binding = "DB"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
database_name = "edgedata-db"

[[services]]
binding = "INGEST_SERVICE"
service = "ingest-worker"

[vars]
SYNTHETIC_ENABLED = "true"
SYNTHETIC_BATCH_SIZE = "24"
SYNTHETIC_BATCH_MIN = "12"
SYNTHETIC_BATCH_MAX = "48"
SYNTHETIC_PROFILE = "otel-demo"
SYNTHETIC_INDEX = "otel-demo"
SYNTHETIC_SERVICE = "frontend"
SYNTHETIC_ENV = "demo"
SYNTHETIC_HOST_PREFIX = "otel-demo-node"
SYNTHETIC_REGION = "us"
INGEST_URL = "https://ingest-worker.example.workers.dev/ingest"
