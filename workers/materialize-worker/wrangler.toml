name = "materialize-worker"
main = "src/index.ts"
compatibility_date = "2026-02-16"

triggers = { crons = ["* * * * *"] }

[env.production]
name = "materialize-worker-prod"

[[env.production.d1_databases]]
binding = "DB"
database_id = "61273132-a0db-4835-a80d-524e77d9d8b4"
database_name = "edgedata-db"

[[env.production.services]]
binding = "QUERY_SERVICE"
service = "query-worker"

[env.production.vars]
QUERY_WORKER_URL = ""

