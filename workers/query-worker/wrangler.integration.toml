name = "query-worker"
main = "src/index.ts"
compatibility_date = "2026-02-16"

[[d1_databases]]
binding = "DB"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
database_name = "edgedata-db"

[[r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "edgedata-raw"

[[analytics_engine_datasets]]
binding = "WAE"
dataset = "log_metrics"

[vars]
CF_ACCOUNT_ID = ""
REQUIRE_ACCESS_JWT = "false"
QUERY_ADMIN_TOKEN = "test-admin-token"
ACCESS_AUD = "edgedata-query-aud"
ACCESS_ISSUER = "https://edgedata.cloudflareaccess.com"
ACCESS_JWKS_URL = ""
ACCESS_SUPERADMIN_GROUPS = "edgedata-superadmins"
ACCESS_VIEWER_GROUPS = "edgedata-viewers"
ACCESS_ANALYST_GROUPS = "edgedata-analysts"
ACCESS_ADMIN_GROUPS = "edgedata-admins"
ACCESS_ADMIN_EMAILS = ""
AUTH_ENABLE_LOCAL_LOGIN = "true"
AUTH_BOOTSTRAP_SUPERADMIN_EMAIL = ""
AUTH_BOOTSTRAP_EMAIL = ""
AUTH_INVITE_TTL_HOURS = "48"
SESSION_TTL_SECONDS = "43200"
QUERY_RATE_LIMIT_PER_MIN = "600"
AUTH_LOGIN_RATE_LIMIT_PER_MIN = "60"
CORS_ORIGINS = "https://edgedata-1fo.pages.dev,https://*.edgedata-1fo.pages.dev"
DEMO_SCENARIOS_ENABLED = "false"

[durable_objects]
bindings = [
  { name = "TAIL_HUB", class_name = "TailHub" },
  { name = "DASHBOARD_CACHE", class_name = "DashboardCache" }
]

[[migrations]]
tag = "v1"
new_classes = ["TailHub"]

[[migrations]]
tag = "v2"
new_classes = ["DashboardCache"]
