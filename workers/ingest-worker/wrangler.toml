name = "ingest-worker"
main = "src/index.ts"
compatibility_date = "2026-02-16"

[env.production]
name = "ingest-worker-prod"

[[env.production.r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "edgedata-raw"

[[env.production.d1_databases]]
binding = "DB"
database_id = "61273132-a0db-4835-a80d-524e77d9d8b4"

[[env.production.analytics_engine_datasets]]
binding = "WAE"
dataset = "log_metrics"

[env.production.vars]
INGEST_RATE_LIMIT_PER_MIN = "2400"

[[env.production.services]]
binding = "QUERY_SERVICE"
service = "query-worker-prod"

[[r2_buckets]]
binding = "RAW_BUCKET"
